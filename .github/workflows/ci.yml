# Integración continua: en cada push y pull request a develop/main corre el
# linter y las pruebas del backend y del frontend (DoD y hito H4: CI en verde).
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Black, Flake8, Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Formato (Black)
        run: black --check .
      - name: Estilo (Flake8)
        run: flake8
      - name: Pruebas (Pytest)
        run: pytest

  frontend:
    name: Frontend (oxlint, Prettier, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Linter (oxlint)
        run: npm run lint
      - name: Formato (Prettier)
        run: npx prettier --check src
      - name: Pruebas (Vitest)
        run: npm test
      - name: Compilación (tsc + Vite)
        run: npm run build
